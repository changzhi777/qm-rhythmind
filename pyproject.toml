[project]
name = "qm-rhythmind"
version = "0.2.0"
description = "律动 RHYTHMIND — Multi-agent AI Health Platform (AG2 + Hermes)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Qingmu Life Tech", email = "dev@qingmu.ai" }]
license = { text = "CC BY-NC 4.0" }

dependencies = [
    "autogen-agentchat>=0.4,<0.5",
    "autogen-ext>=0.4,<0.5",
    "litellm>=1.40,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "sse-starlette>=2.1,<3.0",
    "mcp>=1.0",
    "httpx>=0.27,<0.28",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<0.21",
    "asyncpg>=0.29,<0.30",
    "alembic>=1.13,<2.0",
    "redis[asyncio]>=5.0,<6.0",
    "influxdb-client[async]>=1.44,<1.45",
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<2.0",
    "pillow>=11.0,<12.0",
    "aiofiles>=23.2,<24.0",
    "python-multipart>=0.0.9,<0.1",
    "python-jose[cryptography]>=3.3,<3.4",
    "passlib[bcrypt]>=1.7,<1.8",
    "structlog>=24.1,<25.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "sentry-sdk[fastapi]>=2.5,<2.6",
    "reportlab>=4.2,<5.0",
    "qrcode[pil]>=7.4,<9.0",  # PDF 报告 QR 码水印（dashboard.py:381）
    "langfuse>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "factory-boy>=3.3",
]
cv = [
    "paddlepaddle",
    "paddleocr",
    "mediapipe",
    "opencv-python-headless",
]

[project.urls]
Homepage = "https://github.com/qingmu-ai/qm-rhythmind"

[project.scripts]
rhythmind = "rhythmind.api.main:app"

# ── Tool config ────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/unit/test_thoth_client.py" = ["ANN201", "ANN001", "ANN202"]  # pytest 风格豁免

[tool.ruff.lint.isort]
known-first-party = ["rhythmind"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src/rhythmind"]
omit = ["*/migrations/*", "*/tests/*"]

[dependency-groups]
dev = [
    "fakeredis>=2.35.1",
]

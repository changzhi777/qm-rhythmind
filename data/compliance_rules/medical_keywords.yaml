# medical_keywords.yaml
# 触发 BLOCK 的医疗诊断性关键词（Agent 输出中出现即降级或拦截）
# 规则：完全匹配词组 OR 正则（以 regex: 开头）

block_keywords:
  # 诊断类（纯字符串，_compile_patterns 按 re.escape 处理）
  - 确诊
  - 诊断为
  - 你患有
  - 患者
  - 病情
  - 处方
  # 正则模式（以 "regex: " 开头的字符串，注意必须整体加引号）
  - "regex: 开.*药"
  - "regex: 服用.*mg"
  - "regex: 注射.*剂量"
  # 紧急医疗
  - 心脏病发作
  - 中风
  - 心肌梗塞
  - 脑梗
  # 手术/有创
  - 手术
  - 活检
  - "regex: 切除.*术"

warn_keywords:
  # 营养医疗边界
  - 治疗
  - 治愈
  - 缓解症状
  - 降糖
  - 降压
  - 减肥药
  # 心率高风险
  - 心率异常
  - 心律失常
  - 房颤
  # 伤痛恢复（需加免责声明）
  - 损伤恢复
  - 康复训练
  - 物理治疗

# 必须在所有健康建议末尾追加的免责声明
disclaimer_zh: >
  ⚠️ 以上内容由 AI 生成，仅供参考，不构成医疗诊断或治疗建议。
  如有不适请及时就医。

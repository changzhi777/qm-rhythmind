name: 🐛 Bug 报告
description: 报告一个可复现的问题
title: "[Bug] "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！打上 **bug** 标签后会自动触发修复分支创建流程。
        **作者**：外星动物（常智）/ IoTchange | **项目**：RHYTHMIND 律动

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 清晰简洁地描述这个 Bug
      placeholder: 描述发生了什么...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何复现这个问题
      placeholder: |
        1. 调用 API ...
        2. 传入参数 ...
        3. 观察到错误 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你期望发生什么？
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？请附上错误信息和堆栈跟踪
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: RHYTHMIND 版本
      placeholder: "例如：v0.1.1（见 VERSION 文件）"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: 影响的组件
      multiple: true
      options:
        - HermesBase / Agent 基类
        - MetricsAgent
        - DataAgent
        - CoachAgent
        - SwarmDataCoach
        - FactManager / 健康知识图谱
        - MCP Server
        - Model Adapter (MLX/Ollama/LiteLLM)
        - PromptAuditor / 合规审查
        - FastAPI / 接口层
        - InfluxDB 客户端
        - 其他

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      placeholder: |
        - OS: macOS 15.x / Ubuntu 22.04
        - Python: 3.12.x
        - 硬件: M4 Mac mini 16GB
        - 模型: Qwen3-30B-A3B-4bit (MLX)

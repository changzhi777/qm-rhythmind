name: ✨ 功能请求
description: 建议新功能或改进
title: "[Feature] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        感谢提出功能建议！**RHYTHMIND 律动** · 作者：外星动物（常智）/ IoTchange

  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题
      description: 描述你遇到的痛点或想要的能力
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的解决方案
      description: 你希望如何实现这个功能？
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      options:
        - 🔥 紧急（影响核心功能）
        - 🚀 高（重要改进）
        - 📈 中（有价值但不紧迫）
        - 💡 低（未来考虑）
    validations:
      required: true

# ─────────────────────────────────────────────────────────────────────────────
# RHYTHMIND CI — 持续集成流水线
# 作者：外星动物（常智）/ IoTchange  |  许可：CC BY-NC 4.0
# ─────────────────────────────────────────────────────────────────────────────
#
# 触发条件：
#   - push 到 main / develop 分支
#   - 向 main / develop 发起 Pull Request
#
# 流程：
#   1. 安装 Python 依赖（仅测试所需，跳过平台专用包）
#   2. Ruff lint 检查
#   3. pytest 单元测试（含覆盖率报告）
#   4. 测试结果上传为 Artifact

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装测试依赖
        run: |
          pip install --upgrade pip

          # 核心测试框架
          pip install pytest pytest-asyncio pytest-cov pytest-mock

          # 数据层
          pip install sqlalchemy aiosqlite alembic

          # 配置 & 验证
          pip install pydantic pydantic-settings

          # 日志
          pip install structlog

          # YAML 解析（测试收集阶段需要）
          pip install pyyaml

          # HTTP & API
          pip install httpx openai fastapi sse-starlette

          # JWT
          pip install python-jose[cryptography]

          # 多智能体（Linux 兼容版，跳过 mlx/Apple 专用包）
          pip install autogen-agentchat autogen-ext[openai] || \
          pip install autogen-agentchat

          # MCP
          pip install mcp || true

          # 安装本包（跳过平台专用依赖）
          pip install -e . --no-deps

      - name: Ruff 代码检查
        run: |
          pip install ruff
          ruff check src/ tests/ || true   # 不阻断 CI，仅报告

      - name: 运行单元测试
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENV: test
          PYTHONPATH: src
        run: |
          pytest tests/unit/ \
            --tb=short \
            --cov=src/rhythmind \
            --cov-report=xml \
            --cov-report=term-missing \
            -q

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  lint-only:
    name: 代码规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff format check
        run: ruff format --check src/ tests/ || true
      - name: Ruff lint
        run: ruff check src/ tests/ || true

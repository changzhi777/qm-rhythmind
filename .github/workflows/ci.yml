# ─────────────────────────────────────────────────────────────────────────────
# RHYTHMIND CI — 持续集成流水线
# 作者：外星动物（常智）/ IoTchange  |  许可：CC BY-NC 4.0
# ─────────────────────────────────────────────────────────────────────────────
#
# 触发条件：
#   - push 到 main / develop 分支
#   - 向 main / develop 发起 Pull Request
#
# 流程：
#   1. 安装 Python 依赖
#   2. Ruff lint 检查
#   3. pytest 单元测试（含覆盖率报告）
#   4. 测试结果上传为 Artifact

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]" 2>/dev/null || \
          pip install pytest pytest-asyncio pytest-cov ruff \
            sqlalchemy aiosqlite pydantic pydantic-settings \
            structlog httpx openai mcp mlx-lm 2>/dev/null || \
          pip install pytest pytest-asyncio pytest-cov ruff \
            sqlalchemy aiosqlite pydantic pydantic-settings \
            structlog httpx openai mcp

      - name: Ruff 代码检查
        run: ruff check src/ tests/ || true   # 不阻断 CI，仅报告

      - name: 运行单元测试
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENV: test
        run: |
          pytest tests/unit/ \
            --tb=short \
            --cov=src/rhythmind \
            --cov-report=xml \
            --cov-report=term-missing \
            -q

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  lint-only:
    name: 代码规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff format check
        run: ruff format --check src/ tests/ || true
      - name: Ruff lint
        run: ruff check src/ tests/ || true

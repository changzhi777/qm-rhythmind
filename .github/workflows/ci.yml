# ─────────────────────────────────────────────────────────────────────────────
# RHYTHMIND CI — 持续集成流水线
# 作者：外星动物（常智）/ IoTchange  |  许可：CC BY-NC 4.0
# ─────────────────────────────────────────────────────────────────────────────
#
# 触发条件：
#   - push 到 main / develop 分支
#   - 向 main / develop 发起 Pull Request
#
# 流程：
#   1. 安装 Python 依赖（仅测试所需，跳过平台专用包）
#   2. Ruff lint 检查
#   3. pytest 单元测试（含覆盖率报告）
#   4. 测试结果上传为 Artifact

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装测试依赖
        run: |
          pip install --upgrade pip

          # 核心测试框架
          pip install pytest pytest-asyncio pytest-cov pytest-mock

          # 数据层
          pip install sqlalchemy aiosqlite alembic

          # 配置 & 验证
          pip install pydantic pydantic-settings

          # 日志
          pip install structlog

          # YAML 解析（测试收集阶段需要）
          pip install pyyaml

          # Redis（loop_guard.py 导入需要）
          pip install redis

          # HTTP & API
          pip install httpx openai fastapi sse-starlette

          # JWT
          pip install python-jose[cryptography]

          # 多智能体（Linux 兼容版，跳过 mlx/Apple 专用包）
          pip install autogen-agentchat autogen-ext[openai] || \
          pip install autogen-agentchat

          # MCP
          pip install mcp || true

          # 安装本包（跳过平台专用依赖）
          pip install -e . --no-deps

      - name: Ruff 代码检查
        run: |
          pip install ruff
          ruff check src/ tests/ || true   # 不阻断 CI，仅报告

      - name: 运行单元测试
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          ENV: test
          PYTHONPATH: src
        run: |
          pytest tests/unit/ \
            --tb=short \
            --cov=src/rhythmind \
            --cov-report=xml \
            --cov-report=term-missing \
            -q

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

      - name: 上传测试结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  lint-only:
    name: 代码规范检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff format check
        run: ruff format --check src/ tests/ || true
      - name: Ruff lint
        run: ruff check src/ tests/ || true

  helm-chart:
    name: Helm chart 校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.1
      - name: helm lint
        run: helm lint charts/rhythmind
      - name: helm template (默认 values)
        # 渲染所有可选模板，确保任何排列组合都能编译
        run: |
          helm template rhythmind charts/rhythmind \
            --set serviceMonitor.enabled=true \
            --set prometheusRule.enabled=true \
            --set grafanaDashboard.enabled=true \
            --set ingress.enabled=true \
            --set networkPolicy.enabled=true \
            --set secret.create=true \
            --set 'secret.data.JWT_SECRET=01234567890123456789012345678901' \
            --set 'secret.data.LITELLM_MASTER_KEY=sk-real' \
            --set 'secret.data.DATABASE_URL=postgresql+asyncpg://u:p@h/d' \
            > /tmp/render.yaml
          echo "rendered $(grep -c '^kind:' /tmp/render.yaml) Kubernetes resources"

  poetry-lock-check:
    name: Poetry lock 同步检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 Poetry
        run: pipx install poetry==1.8.3
      - name: 校验 lock 与 pyproject 同步
        # 不存在 lock → 失败提示运行 scripts/bootstrap_lock.sh
        # lock 与 pyproject 不一致 → 提醒重新跑 lock
        run: |
          if [[ ! -f poetry.lock ]]; then
            echo "::error::poetry.lock 缺失。请在本地运行 scripts/bootstrap_lock.sh 后提交。"
            exit 1
          fi
          poetry check --lock

  dep-audit:
    name: 依赖漏洞审计 (pip-audit)
    runs-on: ubuntu-latest
    # CRITICAL/HIGH 阻断；豁免列表见 .pip-audit-allowlist。
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 Poetry + pip-audit
        run: |
          pipx install poetry==1.8.3
          pipx install pip-audit
      - name: 导出 requirements.txt
        # 排除 cv 与 dev 组：cv 是 Apple-only，dev 仅本地测试
        run: |
          poetry export --without cv,dev --without-hashes --format requirements.txt --output /tmp/requirements.txt
          wc -l /tmp/requirements.txt
      - name: 跑 pip-audit（含 allowlist）
        # 在 .pip-audit-allowlist 中维护已知豁免（每条带 expiry 与 issue 链接）
        run: |
          IGNORE_ARGS=""
          if [[ -f .pip-audit-allowlist ]]; then
            # 过滤注释 / 空行，把每个 ID 转成 --ignore-vuln 参数
            while IFS= read -r line; do
              line="${line%%#*}"; line="${line//[[:space:]]/}"
              [[ -z "$line" ]] && continue
              IGNORE_ARGS+=" --ignore-vuln $line"
            done < .pip-audit-allowlist
          fi
          echo "ignored: $IGNORE_ARGS"
          pip-audit -r /tmp/requirements.txt --strict $IGNORE_ARGS

  image-scan:
    name: 容器镜像漏洞扫描 (trivy)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（不推送）
        run: |
          if [[ ! -f poetry.lock ]]; then
            echo "::warning::poetry.lock 缺失，先跑 scripts/bootstrap_lock.sh"
            exit 1
          fi
          docker build -t rhythmind:ci .
      - name: Trivy 扫描（CRITICAL/HIGH 阻断）
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: rhythmind:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: ".trivyignore"

# alembic.ini — Alembic 迁移配置
# 使用方式：
#   alembic upgrade head       # 应用所有迁移
#   alembic downgrade -1       # 回滚一步
#   alembic revision --autogenerate -m "描述"  # 生成新迁移
#   alembic history            # 查看迁移历史

[alembic]
# 迁移脚本目录
script_location = src/rhythmind/db/migrations

# database url 由 env.py 从 settings 读取，此处留空
# sqlalchemy.url 不直接设置（asyncpg 需要特殊处理）
sqlalchemy.url =

# 输出格式
output_encoding = utf-8

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

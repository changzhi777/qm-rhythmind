{{- if .Values.migrationJob.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  # 把版本号编进 name，确保每次升级都生成新 Job（旧 Job 由 ttl 自动回收）
  name: {{ include "rhythmind.fullname" . }}-migrate-{{ include "rhythmind.imageTag" . | replace "." "-" }}
  labels:
    {{- include "rhythmind.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrationJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "rhythmind.selectorLabels" . | nindent 8 }}
        rhythmind.io/job: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "rhythmind.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ include "rhythmind.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef: { name: {{ .Values.secret.name }} }
          env:
            - { name: ENV, value: {{ .Values.env | quote }} }
            {{- if .Values.postgres.existingDsnSecret.name }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingDsnSecret.name }}
                  key:  {{ .Values.postgres.existingDsnSecret.key }}
            {{- else if .Values.postgres.inlineDsn }}
            - { name: DATABASE_URL, value: {{ .Values.postgres.inlineDsn | quote }} }
            {{- end }}
          resources:
            {{- toYaml .Values.migrationJob.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
{{- end }}

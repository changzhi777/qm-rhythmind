{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "rhythmind.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* 警告：仅 dev/staging 适用；生产请用 SealedSecret/ExternalSecret */ -}}
  {{- range $k, $v := .Values.secret.data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}

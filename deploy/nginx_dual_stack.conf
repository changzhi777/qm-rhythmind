# ─────────────────────────────────────────────────────────────────────────────
# RHYTHMIND Nginx Dual-Stack 配置 (IPv4 + IPv6)
# 作者：外星动物（常智）/ IoTchange  |  许可：CC BY-NC 4.0
# ─────────────────────────────────────────────────────────────────────────────
#
# 部署位置: /etc/nginx/sites-enabled/qm_dual_stack.conf
# 由 scripts/ipv6/deploy_ipv6.sh 自动生成
# 重启: sudo systemctl reload nginx
# 验证: sudo nginx -t
# ─────────────────────────────────────────────────────────────────────────────

# ── HTTP → HTTPS 重定向(IPv4 + IPv6) ──
server {
    listen 80;
    listen [::]:80;
    server_name aisport.tech _;

    # Let's Encrypt HTTP-01 挑战需要
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主服务(dual-stack) ──
server {
    # IPv4
    listen 443 ssl;
    # IPv6
    listen [::]:443 ssl;

    http2 on;

    server_name aisport.tech _;

    # SSL 证书(Let's Encrypt 或自签)
    ssl_certificate     /etc/letsencrypt/live/aisport.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aisport.tech/privkey.pem;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 日志(IPv4 和 IPv6 都会记录)
    access_log /var/log/nginx/aisport.tech.access.log;
    error_log  /var/log/nginx/aisport.tech.error.log;

    # ── 客户端最大请求体(配合后端 RequestSizeLimit) ──
    client_max_body_size 10m;

    # ── 后端 API: /qm/api/* ──
    location /qm/api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 透传 IPv6 客户端地址
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 10s;
        proxy_buffering off;

        # WebSocket 支持(可选,未来 chat)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── 前端静态文件 ──
    location /qm/ {
        root /var/www;
        try_files $uri $uri/ /qm/index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ── 健康检查(免鉴权) ──
    location = /qm/api/readyz {
        proxy_pass http://127.0.0.1:8000/readyz;
        access_log off;
    }

    location = /qm/api/livez {
        proxy_pass http://127.0.0.1:8000/livez;
        access_log off;
    }

    # ── favicon ──
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # ── robots.txt ──
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }
}

# ── 仅 HTTP(80 端口)的 fallback,用于健康监控 ──
server {
    listen 8001;
    listen [::]:8001;

    location / {
        return 200 "aisport.tech\n";
        add_header Content-Type text/plain;
    }
}

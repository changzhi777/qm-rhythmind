# Langfuse v2 自托管 — 纯 PostgreSQL 模式（无需 ClickHouse）
#
# 使用方式：
#   docker-compose -f deploy/docker-compose.langfuse.yml up -d
#
# 前置：在 PG 中创建数据库
#   CREATE DATABASE langfuse_db;
#
# 使用 host 网络模式，容器直接使用宿主机网络栈，
# 无需端口映射即可访问 localhost:5432 的 PG。
services:
  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse
    restart: unless-stopped
    network_mode: host
    environment:
      - DATABASE_URL=postgresql://rhythmind:rhythmind@127.0.0.1:5432/langfuse_db
      - PORT=3020
      - HOSTNAME=0.0.0.0
      - NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET:-changeme-use-openssl-rand-hex-32}
      - SALT=${LANGFUSE_SALT:-changeme-use-openssl-rand-hex-32}
      - NEXTAUTH_URL=https://aisport.tech/langfuse
      - TELEMETRY_ENABLED=false
      - LANGFUSE_LOG_LEVEL=info
      - LANGFUSE_S3_EVENT_UPLOAD_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3020/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
